<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shader Stack Editor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="editor-shell">
      <header class="topbar">
        <section class="project-block top-bar-group-wrapper" aria-label="Project">
          <div class="menu-container">
            <button class="icon-button" id="appMenuButton" title="Project menu" aria-label="Project menu">
              <svg width="20" height="20" viewBox="0 0 15 15" fill="none" aria-hidden="true">
                <path d="M1.5 3C1.22 3 1 3.22 1 3.5S1.22 4 1.5 4h12c.28 0 .5-.22.5-.5s-.22-.5-.5-.5h-12ZM1 7.5c0-.28.22-.5.5-.5h12c.28 0 .5.22.5.5s-.22.5-.5.5h-12c-.28 0-.5-.22-.5-.5Zm0 4c0-.28.22-.5.5-.5h12c.28 0 .5.22.5.5s-.22.5-.5.5h-12c-.28 0-.5-.22-.5-.5Z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <div class="design-listing-name">
            <input id="projectNameInput" class="project-name editable-text" value="Untitled project" aria-label="Project name" />
          </div>
          <div class="saving-indicator" title="Saved">
            <svg fill="none" viewBox="0 0 17 17" aria-hidden="true">
              <circle cx="8.5" cy="8.5" r="7.5" fill="currentColor" stroke="currentColor"></circle>
              <path d="m4 8.5 3 3 6-6" stroke="#fff"></path>
            </svg>
          </div>
        </section>

        <nav class="tool-strip" aria-label="Tools">
          <button class="tool-button is-active" data-tool="select" title="Select">
            <svg class="tool-svg" viewBox="0 0 256 256" aria-hidden="true">
              <path d="M38.2 48.5 96.4 203.7a8 8 0 0 0 15-.1l23.3-64.1a8.1 8.1 0 0 1 4.8-4.8l64.1-23.3a8 8 0 0 0 .1-15L48.5 38.2A8 8 0 0 0 38.2 48.5Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
              <line x1="136.6" y1="136.6" x2="208" y2="208" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></line>
            </svg>
          </button>
          <div class="tool-menu">
            <button class="tool-button" id="shapeToolButton" data-tool="shape" title="Shape">
              <svg class="tool-svg" id="shapeToolIcon" viewBox="0 0 256 256" aria-hidden="true">
                <rect x="40" y="40" width="176" height="176" rx="8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></rect>
              </svg>
            </button>
            <div class="floating-menu shape-menu" id="shapeMenu" hidden>
              <button data-shape="rectangle">Rectangle</button>
              <button data-shape="circle">Circle</button>
              <button data-shape="polygon">Polygon</button>
            </div>
          </div>
          <button class="tool-button" data-tool="text" id="textToolButton" title="Text">
            <svg class="tool-svg" viewBox="0 0 256 256" aria-hidden="true">
              <path d="M128 56v144M48 88V56h160v32M96 200h64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
            </svg>
          </button>
          <button class="tool-button" data-tool="media" id="mediaToolButton" title="Upload media">
            <svg class="tool-svg" viewBox="0 0 256 256" aria-hidden="true">
              <rect x="32" y="48" width="192" height="160" rx="8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></rect>
              <path d="M32 168 82.3 117.7a8 8 0 0 1 11.4 0l44.6 44.6a8 8 0 0 0 11.4 0l20.6-20.6a8 8 0 0 1 11.4 0L224 184" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
              <circle cx="156" cy="100" r="10" fill="currentColor"></circle>
            </svg>
          </button>
          <button class="tool-button" data-tool="source" id="sourceToolButton" title="Models and SDF">
            <svg class="tool-svg" viewBox="0 0 256 256" aria-hidden="true">
              <path d="m222.7 67.9-88-48.2a13.9 13.9 0 0 0-13.4 0l-88 48.2A14 14 0 0 0 26 80.2v95.6a14 14 0 0 0 7.3 12.3l88 48.2a13.9 13.9 0 0 0 13.4 0l88-48.2a14 14 0 0 0 7.3-12.3V80.2a14 14 0 0 0-7.3-12.3ZM128 30.3 212.5 76 128 122.2 43.5 76ZM39 177.6a2 2 0 0 1-1-1.8V86.7l84 46V223Zm177.9 0L134 223v-90.4l84-46v89.2a2 2 0 0 1-1.1 1.8Z" fill="currentColor"></path>
            </svg>
          </button>
          <button class="tool-button" data-tool="effects" id="effectsToolButton" title="Effects">
            <svg class="tool-svg" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M10 14v4M10 2v4M7.88 12.12l-3.54 3.53M13.53 6.46l2.12-2.12M6 10H2M18 10h-4M7.88 7.88 4.34 4.34M13.54 13.54l2.12 2.12" stroke="currentColor" stroke-linecap="round"></path>
              <circle cx="10" cy="10" r="1" fill="currentColor"></circle>
            </svg>
          </button>
        </nav>

        <section class="viewport-actions" aria-label="Viewport controls">
          <div class="breakpoint-switch" role="group" aria-label="Breakpoint">
            <button data-breakpoint="desktop" class="is-active">Desktop</button>
            <button data-breakpoint="tablet">Tablet</button>
            <button data-breakpoint="phone">Phone</button>
          </div>

          <div class="preset-picker">
            <button class="preset-button" id="sizePresetButton" aria-haspopup="true">
              <span id="sizePresetLabel">Desktop 1440 x 900</span>
            </button>
            <div class="floating-menu preset-menu" id="sizePresetMenu" hidden></div>
          </div>

          <select id="zoomSelect" class="zoom-select" aria-label="Zoom">
            <option value="0.25">25%</option>
            <option value="0.5">50%</option>
            <option value="0.75">75%</option>
            <option value="1" selected>100%</option>
            <option value="1.25">125%</option>
            <option value="1.5">150%</option>
          </select>

          <button class="pill-button" id="lockScrollButton" aria-pressed="false">Lock Scroll</button>
          <button class="pill-button" id="hdButton" aria-pressed="true">HD</button>
          <button class="icon-action" id="playButton" title="Play / pause" aria-label="Play / pause">Pause</button>
          <button class="primary-action" id="shareButton">Share</button>
          <button class="primary-action" id="exportButton">Export</button>
        </section>
      </header>

      <section class="workspace">
        <aside class="left-panel left-rail control-section-wrapper" aria-label="Project sidebar">
          <div class="panel-nav" id="leftPanelNav">
            <button class="panel-nav-item active" data-left-panel="layers">Layers</button>
            <button class="panel-nav-item" data-left-panel="versions">Versions</button>
            <button class="small-button nav-action" id="addLayerButton">Add</button>
            <button class="small-button nav-action" id="saveVersionButton" hidden>Save</button>
          </div>
          <div class="history">
            <div class="history-scroll-wrap">
              <div class="history-scroll" id="layersPanelContent">
                <ol class="history-list" id="layerList"></ol>
              </div>
              <div class="history-scroll" id="versionsPanelContent" hidden>
                <ol class="history-list" id="versionList"></ol>
              </div>
            </div>
          </div>
        </aside>

        <section class="stage-panel" aria-label="Editor viewport">
          <div class="stage-scroll" id="stageScroll">
            <div class="stage-shell" id="stageShell">
              <div class="stage-frame" id="stageFrame">
                <canvas id="glCanvas" aria-label="Shader background canvas"></canvas>
                <div class="design-surface" id="designSurface" aria-label="Editable layer surface"></div>
              </div>
            </div>
          </div>

          <footer class="timeline-container timeline-empty timeline-peek" aria-label="Timeline">
            <div class="timeline-content">
              <div class="timeline-header">
                <div class="timeline-controls">
                  <button class="timeline-button" id="timelineBackButton" title="Restart">Back</button>
                  <button class="timeline-button" id="timelinePlayButton" title="Preview">Play</button>
                </div>
                <div class="timeline-main-header">
                  <div class="time-markers-container">
                    <div class="time-markers" id="timeMarkers"></div>
                  </div>
                </div>
              </div>
              <div class="playhead" id="playhead">
                <div class="playhead-caret"></div>
                <div class="playhead-line"></div>
              </div>
              <div class="timeline-scroll-container" id="timelineRows"></div>
            </div>
          </footer>
        </section>

        <aside class="inspector-panel" aria-label="Inspector">
          <header class="inspector-header parameters effect-properties control-section-wrapper">
            <div class="parameter parameter__block inspector-title-block">
              <label class="parameter-label" id="selectionTitle">Shape</label>
              <span id="selectionKindLabel" class="font-secondary-color">Rectangle</span>
            </div>
          </header>
          <div class="inspector-tabs panel-nav" role="tablist">
            <button class="panel-nav-item active" data-tab="design" role="tab">Design</button>
            <button class="panel-nav-item" data-tab="events" role="tab">Events</button>
          </div>
          <div class="inspector-content" id="inspectorContent"></div>
        </aside>
      </section>

      <section class="library-palette" id="libraryPalette" hidden aria-label="Library">
        <header>
          <div>
            <p class="eyebrow" id="libraryEyebrow">Library</p>
            <h2 id="libraryTitle">Effects</h2>
          </div>
          <button class="icon-action" id="closeLibraryButton">Close</button>
        </header>
        <div id="libraryContent"></div>
      </section>

      <section class="upload-modal" id="uploadModal" hidden aria-label="Upload media">
        <div class="upload-card">
          <header>
            <div>
              <p class="eyebrow">Upload Media</p>
              <h2>Images, videos & 3D models</h2>
            </div>
            <button class="icon-action" id="closeUploadButton">Close</button>
          </header>
          <label class="drop-zone" id="dropZone" for="assetInput">
            <span>Images, videos & 3D models (GLB/GLTF)</span>
            <strong>click or drag and drop</strong>
            <input
              id="assetInput"
              type="file"
              accept="image/*,video/*,.glb,.gltf,.svg"
              multiple
            />
          </label>
          <ul class="uploaded-list" id="uploadedList"></ul>
        </div>
      </section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
